name: PDUFA Bot — Daily Calendar Update

on:
  # Run every day at 8:00 AM Eastern (12:00 UTC)
  schedule:
    - cron: '0 12 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows bot to commit changes to repo

    steps:
      # ── Step 1: Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Set up Python ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ────────────────────────────────────────
      # yfinance added for the Cap Size market-cap lookup.
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml yfinance

      # ── Step 4: Run the PDUFA bot ───────────────────────────────────────────
      - name: Run PDUFA Bot
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          # MailerLite — REQUIRED for the bot to auto-create the email DRAFT.
          # These two must ALSO exist as repo secrets
          # (Settings → Secrets and variables → Actions). If they're missing,
          # the bot just skips the draft like before — no error, no email.
          # Sender address/name are not here on purpose: the bot already
          # defaults them to alerts@alphabreakoutlab.com / "Alpha Breakout Lab".
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
          # Optional: only used if you add a FINNHUB_API_KEY secret later.
          # If the secret doesn't exist, this is just an empty string and the
          # bot uses yfinance instead — nothing breaks.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python pdufa_bot.py

      # ── Step 5: Check if calendar was updated ───────────────────────────────
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet pdufa_calendar.html || echo "changed=true" >> $GITHUB_OUTPUT

      # ── Step 6: Commit and push if calendar changed ─────────────────────────
      - name: Commit updated calendar
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "pdufa-bot@alphabreakoutlab.com"
          git config --local user.name "Alpha Breakout Lab PDUFA Bot"
          git add pdufa_calendar.html
          git commit -m "🤖 Bot update: New PDUFA date(s) added — $(date +'%Y-%m-%d')"
          git push

      # ── Step 7: Log no changes ──────────────────────────────────────────────
      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "✅ No new PDUFA dates found today. Calendar unchanged."

name: Daily Scanner — Breakout Signals

on:
  # Run every weekday evening after the US market close (23:30 UTC).
  schedule:
    - cron: '30 23 * * 1-5'
  # Allow manual runs from the Actions tab (for testing).
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # lets the job commit the updated page

    steps:
      # ── Step 1: Check out the repo ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Set up Python ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install requests numpy

      # ── Step 4: Run the scanner (writes scanner_results.json) ───────────────
      # Keys come from GitHub Secrets. CI=true is set automatically by Actions,
      # so the scanner skips its interactive "Press Enter" prompts.
      - name: Run scanner
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # Optional — only used if you add these secrets; defaults apply otherwise.
          NEWS_KEYWORDS:  ${{ secrets.NEWS_KEYWORDS }}
          NEWS_POSITIVE:  ${{ secrets.NEWS_POSITIVE }}
          NEWS_NEGATIVE:  ${{ secrets.NEWS_NEGATIVE }}
        run: |
          python watchlist_scanner.py

      # ── Step 5: Render the public page from the results ─────────────────────
      - name: Render scanner page
        run: |
          python render_scanner_page.py

      # ── Step 6: Commit if anything changed ──────────────────────────────────
      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated scanner page
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "scanner-bot@alphabreakoutlab.com"
          git config --local user.name "Alpha Breakout Lab Scanner"
          git commit -m "🤖 Scanner update — $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "No scanner changes today. Page unchanged."
